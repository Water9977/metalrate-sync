# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ef18120fb0529e153befdc750c62c8c1"
name = "Ounce: MetalRate Sync"
application_url = "https://metalrate-sync-app-production-5235.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_app_proxy added for the storefront ticker theme extension -- required
# by Shopify to configure an app proxy at all, confirmed against the live docs
# before adding rather than guessed.
scopes = "write_products,write_app_proxy"

[auth]
redirect_urls = [ "https://metalrate-sync-app-production-5235.up.railway.app/auth/callback" ]

[app_proxy]
# Powers the storefront ticker theme extension: a shop's storefront hits
# https://<shop>.myshopify.com/apps/ticker/rates, Shopify proxies that to
# this app at /apps/proxy/rates (authenticate.public.appProxy verifies
# Shopify's HMAC signature on every request -- see
# app/routes/apps.proxy.rates.tsx).
url = "/apps/proxy"
prefix = "apps"
subpath = "ticker"
